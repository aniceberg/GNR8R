substitutions:
  device_name: cummins-generator-4input
  friendly_name: Cummins Generator 4 Input
  board_type: esp32dev
  wifi_ssid: CHANGE_ME
  wifi_password: CHANGE_ME

  input1_pin: GPIO32
  input2_pin: GPIO33
  input3_pin: GPIO25
  input4_pin: GPIO26

  input1_name: generator_output_1
  input2_name: generator_output_2
  input3_name: ats_utility_available
  input4_name: ats_on_generator

  input1_inverted: "false"
  input2_inverted: "false"
  input3_inverted: "false"
  input4_inverted: "false"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  comment: >
    Read-only Cummins generator discrete monitor. Use opto-isolated inputs only.
    Do not connect TB6/TB7 or ATS wiring directly to ESP32 GPIO.

esp32:
  board: ${board_type}
  framework:
    type: arduino

logger:

api:

ota:
  - platform: esphome

wifi:
  ssid: ${wifi_ssid}
  password: ${wifi_password}

binary_sensor:
  - platform: gpio
    name: ${input1_name}
    pin:
      number: ${input1_pin}
      mode:
        input: true
      inverted: ${input1_inverted}
    filters:
      - delayed_on_off: 50ms

  - platform: gpio
    name: ${input2_name}
    pin:
      number: ${input2_pin}
      mode:
        input: true
      inverted: ${input2_inverted}
    filters:
      - delayed_on_off: 50ms

  - platform: gpio
    name: ${input3_name}
    pin:
      number: ${input3_pin}
      mode:
        input: true
      inverted: ${input3_inverted}
    filters:
      - delayed_on_off: 50ms

  - platform: gpio
    name: ${input4_name}
    pin:
      number: ${input4_pin}
      mode:
        input: true
      inverted: ${input4_inverted}
    filters:
      - delayed_on_off: 50ms
