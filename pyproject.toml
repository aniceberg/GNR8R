[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cummins-generator-ha"
version = "0.1.0"
description = "Home Assistant custom integration for Cummins PowerCommand generators over Modbus RTU"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "Isaac" }]
dependencies = [
  "homeassistant>=2025.1.0",
  "pymodbus>=3.8.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.25.0",
  "pytest-cov>=6.0.0",
  "pytest-homeassistant-custom-component>=0.13.212",
  "ruff>=0.11.0",
]

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "UP",
  "B",
  "C4",
  "SIM",
  "ASYNC",
]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["SLF001"]

[tool.setuptools]
packages = []
